name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查预装的 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -1 "$ANDROID_HOME" || true
          echo "--- build-tools ---"
          ls -1 "$ANDROID_HOME/build-tools" || true
          echo "--- platforms ---"
          ls -1 "$ANDROID_HOME/platforms" || true

      - name: 安装所需 SDK 组件并导出路径
        run: |
          set -e

          SDKMGR=""
          for p in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"
          do
            if [ -x "$p" ]; then SDKMGR="$p"; break; fi
          done

          if [ -z "$SDKMGR" ]; then
            echo "未找到 sdkmanager，使用预装组件"
          else
            echo "sdkmanager: $SDKMGR"
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" || true
          fi

          PLATFORM_DIR=""
          for d in "$ANDROID_HOME/platforms"/*; do
            if [ -f "$d/android.jar" ]; then PLATFORM_DIR="$d"; fi
          done
          if [ -z "$PLATFORM_DIR" ]; then
            echo "错误：找不到任何 android.jar"
            exit 1
          fi
          echo "使用 platform: $PLATFORM_DIR"
          echo "ANDROID_JAR=$PLATFORM_DIR/android.jar" >> $GITHUB_ENV

          BT_DIR=""
          if [ -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            BT_DIR="$ANDROID_HOME/build-tools/34.0.0"
          else
            BT_DIR=$(ls -1d "$ANDROID_HOME/build-tools"/* 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$BT_DIR" ] || [ ! -x "$BT_DIR/aapt2" ]; then
            echo "错误：找不到可用的 build-tools"
            exit 1
          fi
          echo "使用 build-tools: $BT_DIR"
          echo "BUILD_TOOLS=$BT_DIR" >> $GITHUB_ENV
          "$BT_DIR/aapt2" version || true

      - name: 编译资源（aapt2 compile）
        run: |
          set -e
          mkdir -p build/gen build/obj build/dex dist
          "$BUILD_TOOLS/aapt2" compile --dir jump_timer/src/res -o build/res.zip

      - name: 链接资源并生成 R.java（aapt2 link）
        run: |
          set -e
          "$BUILD_TOOLS/aapt2" link \
            -o build/base.apk \
            -I "$ANDROID_JAR" \
            --manifest jump_timer/src/AndroidManifest.xml \
            --java build/gen \
            --min-sdk-version 21 \
            --target-sdk-version 34 \
            build/res.zip
          find build/gen -name "*.java" -exec cat {} \;

      - name: 编译 Java 源码
        run: |
          set -e
          find jump_timer/src -name "*.java" > build/sources.txt
          find build/gen -name "*.java" >> build/sources.txt
          cat build/sources.txt
          javac -source 8 -target 8 -encoding UTF-8 \
            -bootclasspath "$ANDROID_JAR" \
            -classpath "$ANDROID_JAR" \
            -d build/obj \
            @build/sources.txt

      - name: 转换为 dex（d8）
        run: |
          set -e
          find build/obj -name "*.class" > build/classes.txt
          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --min-api 21 \
            --output build/dex \
            $(cat build/classes.txt)
          ls -la build/dex

      - name: 打包 dex 进 APK
        run: |
          set -e
          cd build/dex
          zip -u ../base.apk classes.dex
          cd ../..

      - name: 对齐（zipalign）
        run: |
          "$BUILD_TOOLS/zipalign" -f -p 4 build/base.apk build/aligned.apk

      - name: 生成签名密钥
        run: |
          keytool -genkeypair -v \
            -keystore build/release.keystore \
            -alias jump_timer \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Jump Timer, OU=Dev, O=Local, L=NA, ST=NA, C=CN"

      - name: 签名 APK（apksigner）
        run: |
          "$BUILD_TOOLS/apksigner" sign \
            --ks build/release.keystore \
            --ks-key-alias jump_timer \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out dist/JumpTimer.apk \
            build/aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose dist/JumpTimer.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: JumpTimer-APK
          path: dist/JumpTimer.apk
          retention-days: 30
